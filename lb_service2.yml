apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deppod1
  name: deppod1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: deppod1
  template:
    metadata:
      labels:
        app: deppod1
    spec:
      containers:
      - image: nginx:1.14
        name: server

---

apiVersion: v1
kind: Service
metadata:
  name: app-nlb
  labels:
    app: app1
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enable: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-enable: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-timeout: "30"
spec:
  type: LoadBalancer
  selector:
    app: deppod1
  ports:
    - port: 8000
      targetPort: 80
      protocol: TCP

