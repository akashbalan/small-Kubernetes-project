apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deppod1
  name: deppod1
spec:
  minReadySeconds: 10
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  replicas: 2
  selector:
    matchLabels:
      app: deppod1
  template:
    metadata:
      labels:
        app: deppod1
    spec:
      containers:
        - image: nginx
          name: nginx

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: deppod1
  name: deppod1
spec:
  selector:
    matchLabels:
      app: deppod1
  template:
    metadata:
      labels:
        app: deppod1
    spec:
      containers:
        - image: nginx
          name: nginx
