apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
  labels:
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: 3
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
      - name: my-pod
        image: us-docker.pkg.dev/google-samples/containers/gke/gb-frontend:v5

---


apiVersion: v1
kind: Service
metadata:
  labels:
    run: my-pod
  name: frontendservice
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 80
  selector:
    tier: frontend
  type: NodePort
status:
  loadBalancer: {}

