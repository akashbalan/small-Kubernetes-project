apiVersion: v1
kind: Service
metadata:
  name: app-nlb
  labels:
    app: app1
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enable: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-enable: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-timeout: "30"
spec:
  type: LoadBalancer
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP


apiVersion: v1
kind: Service
metadata:
  labels:
    run: my-pod
  name: my-pod
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 80
  selector:
    run: hello
  type: NodePort